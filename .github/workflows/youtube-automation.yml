name: YT Auto - Advanced Video Pipeline

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Use a GitHub-hosted runner for small jobs or your own video runner for large files"
        required: true
        type: choice
        options:
          - github-hosted
          - self-hosted-video
        default: self-hosted-video
      upload_to_discord:
        description: "Upload processed videos through the Discord webhook secret"
        required: true
        type: boolean
        default: false
      publish_to_buffer:
        description: "Publish immediately to Buffer (requires Discord upload and Google service-account access)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yt-auto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Analyze and run Parts 2-5
    runs-on: ${{ inputs.runner == 'self-hosted-video' && fromJSON('["self-hosted","linux","x64","video"]') || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          mkdir -p /content "$RUNNER_TEMP/yt-auto-executed"
          df -h /content

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade jupyter nbconvert ipykernel nbformat

      - name: Restore metadata and publishing state
        uses: actions/cache@v4
        with:
          path: |
            /content/metadata_files
            /content/Ready_!/_BUFFER_SHEET_ONLY_UPLOADER/state
          key: yt-auto-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            yt-auto-state-${{ github.ref_name }}-

      - name: Analyze notebooks and prepare runner compatibility
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path

          files = ["Part_2.ipynb", "Part_3.ipynb", "Part_4.ipynb", "Part_5.ipynb"]
          descriptions = {
              "Part_2.ipynb": "Downloads source videos and creates 80-second clips with FFmpeg.",
              "Part_3.ipynb": "Downloads assets and renders vertical 1080x1920 videos with overlays.",
              "Part_4.ipynb": "Generates/ranks social metadata, creates thumbnails and category CSV files, and optionally uploads to Discord.",
              "Part_5.ipynb": "Reads metadata CSVs and Google Sheets routing, then optionally publishes through Buffer.",
          }

          summary = ["## YT_Auto notebook analysis", ""]
          total_lines = 0

          for filename in files:
              path = Path(os.environ["GITHUB_WORKSPACE"]) / filename
              if not path.is_file():
                  raise SystemExit(f"Required notebook missing: {filename}")

              notebook = json.loads(path.read_text(encoding="utf-8"))
              cells = [c for c in notebook.get("cells", []) if c.get("cell_type") == "code"]
              if not cells:
                  raise SystemExit(f"No code cells found in {filename}")

              count = 0
              for index, cell in enumerate(cells, start=1):
                  source = cell.get("source", [])
                  source = "".join(source) if isinstance(source, list) else str(source)
                  count += len(source.splitlines())
                  # Ignore IPython shell/magic lines for the Python syntax preflight.
                  syntax_source = "\n".join(
                      line for line in source.splitlines()
                      if not line.lstrip().startswith(("!", "%"))
                  )
                  try:
                      ast.parse(syntax_source, filename=f"{filename}:cell-{index}")
                  except SyntaxError as exc:
                      raise SystemExit(
                          f"Syntax error in {filename}, cell {index}, line {exc.lineno}: {exc.msg}"
                      ) from exc

              total_lines += count
              summary.append(
                  f"- **{filename}** — {len(cells)} code cell(s), {count} code line(s). "
                  f"{descriptions[filename]}"
              )

              for cell in cells:
                  source = cell.get("source", [])
                  source = "".join(source) if isinstance(source, list) else str(source)

                  if filename == "Part_2.ipynb":
                      source = source.replace(
                          'subprocess.run("apt-get -qq update", shell=True, check=True)\n', ""
                      )
                      source = source.replace(
                          'subprocess.run("apt-get -qq install -y ffmpeg", shell=True, check=True)\n', ""
                      )
                      source = source.replace(
                          "MAX_PARALLEL_VIDEOS = 10",
                          "MAX_PARALLEL_VIDEOS = min(2, os.cpu_count() or 1)"
                      )

                  elif filename == "Part_3.ipynb":
                      source = source.replace("!apt-get update -qq\n", "")
                      source = source.replace("!apt-get install -y -qq ffmpeg fonts-dejavu\n", "")

                  elif filename == "Part_4.ipynb":
                      source = re.sub(
                          r"(?m)^DISCORD_WEBHOOK_URL\s*=.*$",
                          'DISCORD_WEBHOOK_URL = os.getenv("DISCORD_WEBHOOK_URL", "").strip()',
                          source,
                          count=1,
                      )
                      source = re.sub(
                          r"(?m)^if not (OPENROUTER_API_KEY|GROQ_API_KEY|GEMINI_API_KEY):\n\s+\1 = getpass\(.*\)\n?",
                          "",
                          source,
                      )
                      source = re.sub(
                          r"(?ms)^OPENROUTER_MODELS\s*=\s*\[.*?^\]",
                          'OPENROUTER_MODELS = ["openrouter/free"]',
                          source,
                          count=1,
                      )
                      needle = '    print(f"  Uploading {os.path.basename(video_path)} to Discord...")'
                      replacement = (
                          '    if not DISCORD_WEBHOOK_URL:\n'
                          '        print("  Discord upload disabled: DISCORD_WEBHOOK_URL is not configured.")\n'
                          '        return "N/A"\n'
                          + needle
                      )
                      if needle in source:
                          source = source.replace(needle, replacement, 1)

                  elif filename == "Part_5.ipynb":
                      source = source.replace(
                          'SOURCE_ROOT = "/content/drive/MyDrive/Ready_!"',
                          'SOURCE_ROOT = "/content/Ready_!"',
                          1,
                      )
                      source, changed = re.subn(
                          r"(?ms)^def ensure_drive\(\):\n.*?(?=^def google_services\(\):)",
                          "def ensure_drive():\n    os.makedirs(SOURCE_ROOT, exist_ok=True)\n\n",
                          source,
                          count=1,
                      )
                      if changed != 1:
                          raise SystemExit(
                              "Could not patch Part_5 Colab Drive mount; manual migration is required."
                          )

                  cell["source"] = source.splitlines(keepends=True)

              path.write_text(
                  json.dumps(notebook, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          summary.extend(["", f"**Total Python lines inspected:** {total_lines}", ""])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n".join(summary))

          print("Notebook analysis and runner compatibility patches completed.")
          PY

      - name: Validate secrets and run options
        shell: bash
        env:
          UPLOAD_TO_DISCORD: ${{ inputs.upload_to_discord }}
          PUBLISH_TO_BUFFER: ${{ inputs.publish_to_buffer }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" && -z "$GROQ_API_KEY" && -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Add at least one AI secret: OPENROUTER_API_KEY, GROQ_API_KEY, or GEMINI_API_KEY."
            exit 1
          fi
          if [[ "$UPLOAD_TO_DISCORD" == "true" && -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL is required when Discord upload is enabled."
            exit 1
          fi
          if [[ "$PUBLISH_TO_BUFFER" == "true" && "$UPLOAD_TO_DISCORD" != "true" ]]; then
            echo "::error::Buffer publishing requires upload_to_discord=true because Part_5 consumes video URLs from Part_4 CSV files."
            exit 1
          fi

      - name: Run Part 2 - Long video clipping
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute "$GITHUB_WORKSPACE/Part_2.ipynb" \
            --output "Part_2.executed.ipynb" \
            --output-dir "$RUNNER_TEMP/yt-auto-executed" \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.cwd=/content

      - name: Run Part 3 - Vertical video rendering
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute "$GITHUB_WORKSPACE/Part_3.ipynb" \
            --output "Part_3.executed.ipynb" \
            --output-dir "$RUNNER_TEMP/yt-auto-executed" \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.cwd=/content
          rendered="$(find '/content/Ready_!' -type f -iname '*.mp4' 2>/dev/null | wc -l)"
          echo "Rendered videos: $rendered"
          if [[ "$rendered" -eq 0 ]]; then
            echo "::error::Part_3 produced no MP4 files in /content/Ready_!."
            exit 1
          fi

      - name: Run Part 4 - AI metadata, thumbnails and optional Discord upload
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ inputs.upload_to_discord && secrets.DISCORD_WEBHOOK_URL || '' }}
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute "$GITHUB_WORKSPACE/Part_4.ipynb" \
            --output "Part_4.executed.ipynb" \
            --output-dir "$RUNNER_TEMP/yt-auto-executed" \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.cwd=/content
          csv_count="$(find /content/metadata_files -maxdepth 1 -type f -name '*.csv' 2>/dev/null | wc -l)"
          echo "Metadata CSV files: $csv_count"
          if [[ "$csv_count" -eq 0 ]]; then
            echo "::error::Part_4 produced no metadata CSV files."
            exit 1
          fi

      - name: Prepare Google service-account credentials for Part 5
        if: ${{ inputs.publish_to_buffer }}
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Add GOOGLE_SERVICE_ACCOUNT_JSON before enabling Buffer publishing."
            exit 1
          fi
          credentials_file="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Run Part 5 - Optional Buffer publishing
        if: ${{ inputs.publish_to_buffer }}
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute "$GITHUB_WORKSPACE/Part_5.ipynb" \
            --output "Part_5.executed.ipynb" \
            --output-dir "$RUNNER_TEMP/yt-auto-executed" \
            --ExecutePreprocessor.timeout=-1 \
            --ExecutePreprocessor.cwd=/content

      - name: Upload metadata and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-auto-results-${{ github.run_number }}
          path: |
            /content/metadata_files/**/*.csv
            /content/thumbnails/**
            /content/Ready_!/_BUFFER_SHEET_ONLY_UPLOADER/state/**
            /content/Ready_!/_BUFFER_SHEET_ONLY_UPLOADER/logs/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Final summary
        if: always()
        shell: bash
        env:
          RUNNER_CHOICE: ${{ inputs.runner }}
          DISCORD_UPLOAD: ${{ inputs.upload_to_discord }}
          BUFFER_PUBLISH: ${{ inputs.publish_to_buffer }}
        run: |
          {
            echo "## YT_Auto run summary"
            echo ""
            echo "- Runner: \`$RUNNER_CHOICE\`"
            echo "- Discord upload enabled: \`$DISCORD_UPLOAD\`"
            echo "- Buffer publishing enabled: \`$BUFFER_PUBLISH\`"
            echo "- Artifacts: metadata CSVs, thumbnails, and Buffer state/logs when present"
            echo ""
            echo "Large source and rendered videos are not uploaded as GitHub artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
